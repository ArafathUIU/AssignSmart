services:
  db:
    image: postgres:16-alpine
    container_name: assignsmart-db
    environment:
      POSTGRES_DB: assignsmart
      POSTGRES_USER: assignsmart
      POSTGRES_PASSWORD: assignsmart
    ports:
      - "5433:5432"
    volumes:
      - assignsmart-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assignsmart -d assignsmart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  assignsmart-pgdata:
